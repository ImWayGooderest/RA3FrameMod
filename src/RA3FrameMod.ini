[RA3FrameMod]
; 1 = mod active, 0 = game runs completely vanilla (the DLL only forwards sound calls)
Enabled=1

; Render frame rate. The simulation always stays at its normal speed.
; Valid values: 30 (vanilla), 45, 90. Anything else is rounded down to one of these,
; because the engine splits each 15 Hz game tick into 6 sub-steps (15 x 1/2/3/6 only).
TargetFPS=90

; When the PC can't hold TargetFPS, run extra game sub-steps on the next frames so the game
; keeps normal speed (dips cost smoothness, not speed). Offline games only; online the
; network keeps everyone in step. 0 = vanilla behaviour (game slows down with the frame rate).
CatchUp=1

; Unit/model animations normally advance one 30 fps frame per drawn frame, so at 90 fps
; they'd play 3x too fast (units look like they run in place). 1 = time them to the game.
FixAnimationSpeed=1

; Ultrawide fix: on screens wider than 16:9 the game keeps a 16:9 horizontal view and crops
; the top and bottom (looks zoomed in). 1 = widen the view instead, so you see as much
; vertically as on 16:9 plus extra on the sides.
WidescreenFix=1

; Extra field of view on top of that, in percent of the normal view (100 = normal).
; 110-120 shows more of the battlefield; very high values distort the edges.
FOVPercent=100

; Write RA3FrameMod.log next to this file. LogStats adds a line every 5 seconds with the
; measured draw rate and game-logic rate (logic should always read ~15 Hz).
Log=1
LogStats=1
